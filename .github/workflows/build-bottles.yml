name: Build Bottles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v0.1.0)'
        required: true
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build'
        required: false
        type: string

jobs:
  build-wasm:
    name: Build WebAssembly Archive
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}

      - name: Install SDK download tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl

      - name: Install WebAssembly SDK
        run: |
          curl --fail --location --retry 3 --output /tmp/swift-wasm-sdk.tar.gz \
            https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
          swift sdk install /tmp/swift-wasm-sdk.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

      - name: Check packaging
        run: Scripts/tests/package-wasm-test.sh

      - name: Build WebAssembly products
        run: >-
          swift build -c release --build-system native --jobs 4
          --swift-sdk swift-6.4.0-RELEASE_wasm --scratch-path /tmp/wasm-build
          -Xlinker -z -Xlinker stack-size=8388608

      - name: Create and check WebAssembly archive
        env:
          TAG: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
        run: |
          PRODUCTS=$(swift build -c release --build-system native \
            --swift-sdk swift-6.4.0-RELEASE_wasm --scratch-path /tmp/wasm-build --show-bin-path)
          PACKAGE="swift-modelling-${TAG}-wasm32-wasi"
          Scripts/package-wasm.sh "$PRODUCTS" "$PACKAGE"
          tar czf "${PACKAGE}.tar.gz" "$PACKAGE"
          sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          EXTRACTED=$(mktemp -d)
          tar xzf "${PACKAGE}.tar.gz" -C "$EXTRACTED"
          Scripts/test-wasm-package.sh "$(command -v wasmkit)" "$EXTRACTED/$PACKAGE" "${TAG#v}"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          files: |
            swift-modelling-*-wasm32-wasi.tar.gz
            swift-modelling-*-wasm32-wasi.tar.gz.sha256

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: "swift-6.2-release"
          swift-build: "6.2-RELEASE"
          cache: true

      - name: Swift version
        run: swift --version

      - name: Build release
        run: swift build -c release

      - name: Determine architecture
        shell: bash
        run: |
          ARCH=$(uname -m)
          echo "ARCH=$ARCH" >> $GITHUB_ENV

      - name: Create archive
        shell: pwsh
        run: |
          $TAG = "${{ inputs.tag || github.event.inputs.tag || github.ref_name }}"
          New-Item -ItemType Directory -Force -Path bottle
          Copy-Item .build/release/swift-ecore.exe bottle/
          Copy-Item .build/release/swift-atl.exe bottle/
          Copy-Item .build/release/swift-mtl.exe bottle/
          # Resource bundles (templates, transformations, metamodels) must sit next to the executables
          Get-ChildItem .build/release -Directory -Filter *.resources |
            Where-Object { $_.Name -notmatch '(Tests|-tests)\.resources$' } |
            ForEach-Object { Copy-Item $_.FullName bottle/ -Recurse }
          if (-not (Get-ChildItem bottle -Directory -Filter *.resources)) {
            Write-Error "No resource bundles found in .build/release"
            exit 1
          }
          Compress-Archive -Path bottle/* -DestinationPath "swift-modelling-${TAG}-windows-${{ env.ARCH }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          files: swift-modelling-${{ inputs.tag || github.event.inputs.tag || github.ref_name }}-windows-${{ env.ARCH }}.zip

  build-macos:
    name: Build macOS Bottle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.1.1"

      - name: Swift version
        run: swift --version

      - name: Build release
        run: swift build -c release

      - name: Determine version and platform
        run: |
          TAG="${{ inputs.tag || github.event.inputs.tag || github.ref_name }}"
          # Strip 'v' prefix for Homebrew version (v0.1.0 -> 0.1.0)
          VERSION="${TAG#v}"
          ARCH=$(uname -m)
          # Map architecture to Homebrew platform name
          if [ "$ARCH" = "arm64" ]; then
            PLATFORM="arm64_sequoia"
          else
            PLATFORM="sequoia"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV

      - name: Create Homebrew bottle
        run: |
          # Create the keg: launchers in bin, executables and resource bundles in libexec
          Scripts/package-bottle.sh .build/release swift-modelling/${{ env.VERSION }}
          # Create bottle tarball with Homebrew naming convention
          tar czf swift-modelling-${{ env.VERSION }}.${{ env.PLATFORM }}.bottle.tar.gz swift-modelling

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          files: swift-modelling-${{ env.VERSION }}.${{ env.PLATFORM }}.bottle.tar.gz

  build-linux:
    name: Build Linux Bottle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Swift version
        run: swift --version

      - name: Build release
        run: swift build -c release

      - name: Determine version and platform
        run: |
          TAG="${{ inputs.tag || github.event.inputs.tag || github.ref_name }}"
          # Strip 'v' prefix for Homebrew version (v0.1.0 -> 0.1.0)
          VERSION="${TAG#v}"
          ARCH=$(uname -m)
          # Map to Homebrew platform name
          PLATFORM="${ARCH}_linux"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV

      - name: Create Homebrew bottle
        run: |
          # Create the keg: launchers in bin, executables and resource bundles in libexec
          Scripts/package-bottle.sh .build/release swift-modelling/${{ env.VERSION }}
          # Create bottle tarball with Homebrew naming convention
          tar czf swift-modelling-${{ env.VERSION }}.${{ env.PLATFORM }}.bottle.tar.gz swift-modelling

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          files: swift-modelling-${{ env.VERSION }}.${{ env.PLATFORM }}.bottle.tar.gz
