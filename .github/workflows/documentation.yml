name: Documentation

on:
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Swift version
        run: swift --version

      - name: Install docc-static
        run: brew install mipalgu/tap/swift-docc-static

      - name: Generate documentation
        run: |
          docc-static generate \
            --package-path . \
            --output .build/documentation \
            --external-docs swift-ecore=https://mipalgu.github.io/swift-ecore \
            --external-docs swift-aql=https://mipalgu.github.io/swift-aql \
            --external-docs swift-mtl=https://mipalgu.github.io/swift-mtl \
            --external-docs swift-atl=https://mipalgu.github.io/swift-atl \
            --external-docs swift-henshin=https://mipalgu.github.io/swift-henshin \
            --external-docs swift-epsilon=https://mipalgu.github.io/swift-epsilon \
            --external-docs swift-xtend=https://mipalgu.github.io/swift-xtend \
            --external-docs swift-argument-parser=https://swiftpackageindex.com/apple/swift-argument-parser/~ \
            --external-docs swift-subprocess=https://swiftpackageindex.com/swiftlang/swift-subprocess/~ \
            --external-docs swift-collections=https://swiftpackageindex.com/apple/swift-collections/~ \
            --verbose

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/documentation

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
